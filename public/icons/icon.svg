<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#boxGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Speed Lines -->
  <path d="M70 200 H160" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M40 256 H130" stroke="#10b981" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M80 312 H150" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" opacity="0.5"/>

  <!-- Central Package Cube (Isometric Style) -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Top Face -->
    <polygon points="0,-110 110,-55 0,0 -110,-55" fill="#60a5fa"/>
    
    <!-- Left Face -->
    <polygon points="-110,-55 0,0 0,110 -110,55" fill="#2563eb"/>
    
    <!-- Right Face -->
    <polygon points="0,0 110,-55 110,55 0,110" fill="#1d4ed8"/>

    <!-- Tape Lines -->
    <polygon points="-25,-97.5 25,-72.5 25,27.5 -25,2.5" fill="url(#accentGrad)" opacity="0.9"/>
    <polygon points="-110,-55 -85,-42.5 -85,67.5 -110,55" fill="#10b981" opacity="0.6"/>
  </g>

  <!-- Checkmark Badge -->
  <circle cx="380" cy="380" r="54" fill="url(#accentGrad)" filter="url(#shadow)"/>
  <path d="M356 380 L372 396 L404 364" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
